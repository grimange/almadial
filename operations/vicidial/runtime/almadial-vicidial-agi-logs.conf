# Asterisk AGIs and root VICIdial workers share PATHlogs. Root retains ownership.
# A named-user/default ACL permits the asterisk service user to append logs even
# when a root worker creates tomorrow's daily file first (normal mode 0666).
# Apply explicitly: systemd-tmpfiles --create /etc/tmpfiles.d/almadial-vicidial-agi-logs.conf
# Existing action logs need access ACLs; do not recurse into archived logs.
a+ /var/log/astguiclient - - - - u:asterisk:rwx,d:u::rwx,d:u:asterisk:rwx,d:g::r-x,d:m::rwx,d:o::r-x
a+ /var/log/astguiclient/action_* - - - - u:asterisk:rw-,m::rw-
