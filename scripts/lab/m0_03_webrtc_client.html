<!doctype html>
<meta charset="utf-8">
<title>AlmaDial ALM-3 isolated Echo qualification</title>
<h1>ALM-3 native Echo qualification</h1>
<p>Disposable lab only. Automated synthetic media; no physical microphone/speaker claim.</p>
<audio id="remote" autoplay></audio>
<script src="sip.js"></script>
<script>
'use strict';
window.alm = {events: [], captures: {}, stats: []};
const alm = window.alm;
const event = (type, data = {}) => alm.events.push({time: performance.now(), type, ...data});
const nativeGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
navigator.mediaDevices.getUserMedia = async options => {
  const stream = await nativeGetUserMedia(options);
  alm.localStream = stream;
  event('getUserMedia', {settings: stream.getAudioTracks().map(t => t.getSettings())});
  return stream;
};
const NativePC = window.RTCPeerConnection;
window.RTCPeerConnection = class extends NativePC {
  constructor(...args) {
    super(...args); alm.pc = this;
    for (const name of ['iceconnectionstatechange', 'connectionstatechange', 'signalingstatechange'])
      this.addEventListener(name, () => event(name, {ice: this.iceConnectionState, connection: this.connectionState, signaling: this.signalingState}));
    this.addEventListener('track', e => { alm.remoteStream = new MediaStream([e.track]); event('remote-track', {kind: e.track.kind}); });
  }
};
alm.register = async password => {
  alm.user = new SIP.Web.SimpleUser('wss://' + location.host + '/ws', {
    aor: 'sip:9001@almadial-alma10.test',
    media: {constraints: {audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}, video: false}, remote: {audio: document.getElementById('remote')}},
    userAgentOptions: {authorizationUsername: '9001', authorizationPassword: password, logLevel: 'error', transportOptions: {server: 'wss://' + location.host + '/ws', traceSip: false}},
    delegate: {onRegistered: () => event('registered'), onUnregistered: () => event('unregistered'), onCallAnswered: () => event('answered'), onCallHangup: () => event('hangup')}
  });
  await alm.user.connect(); await alm.user.register();
};
alm.call = async () => { await alm.user.call('sip:9001@almadial-alma10.test'); };
alm.snapshot = async () => {
  if (!alm.pc) return {};
  const rows = [...(await alm.pc.getStats()).values()].filter(r => ['inbound-rtp','outbound-rtp','transport','candidate-pair','local-candidate','remote-candidate','codec'].includes(r.type));
  const result = {utc: new Date().toISOString(), ice: alm.pc.iceConnectionState, connection: alm.pc.connectionState,
    localSdp: alm.pc.localDescription?.sdp, remoteSdp: alm.pc.remoteDescription?.sdp, rows};
  alm.stats.push(result); return result;
};
alm.capture = async seconds => {
  if (!alm.localStream || !alm.remoteStream) throw new Error('Both real peer streams are required');
  const ctx = new AudioContext({sampleRate: 16000}); await ctx.resume();
  const captures = {local: [], remote: []}; const nodes = [];
  for (const [key, stream] of Object.entries({local: alm.localStream, remote: alm.remoteStream})) {
    const source = ctx.createMediaStreamSource(stream), processor = ctx.createScriptProcessor(1024, 1, 1), mute = ctx.createGain();
    mute.gain.value = 0;
    processor.onaudioprocess = e => captures[key].push(new Float32Array(e.inputBuffer.getChannelData(0)));
    source.connect(processor); processor.connect(mute); mute.connect(ctx.destination); nodes.push(source, processor, mute);
  }
  const start = new Date().toISOString();
  await new Promise(resolve => setTimeout(resolve, seconds*1000));
  for (const n of nodes) n.disconnect(); await ctx.close();
  function wav(chunks) {
    const length = chunks.reduce((n,c)=>n+c.length,0), buffer = new ArrayBuffer(44+length*2), view = new DataView(buffer);
    const text = (offset,s) => [...s].forEach((c,i)=>view.setUint8(offset+i,c.charCodeAt(0)));
    text(0,'RIFF'); view.setUint32(4,36+length*2,true); text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,length*2,true);
    let i=44;for(const chunk of chunks)for(const value of chunk){view.setInt16(i,Math.round(Math.max(-1,Math.min(1,value))*32767),true);i+=2;}
    return new Blob([buffer],{type:'audio/wav'});
  }
  alm.captures={local:wav(captures.local),remote:wav(captures.remote)};
  event('capture',{start,seconds,sampleRate:16000,localFrames:captures.local.length,remoteFrames:captures.remote.length});
  return {start,seconds,localBytes:alm.captures.local.size,remoteBytes:alm.captures.remote.size};
};
alm.download = name => {const a=document.createElement('a');a.href=URL.createObjectURL(alm.captures[name]);a.download=name+'.wav';a.click();};
alm.downloadJson = (name, value) => {const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));a.download=name+'.json';a.click();};
alm.hangup = async () => {await alm.user.hangup();await alm.user.unregister();await alm.user.disconnect();};
</script>
